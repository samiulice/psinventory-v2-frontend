  <style>
    h2 {
      overflow: hidden;

    /* Force the table to fit within its container */
    .datatable-buttons {
      width: 100% !important;
      table-layout: auto;
      /* Fix column width to prevent overflow */
    }

    .datatable-buttons tbody tr:nth-child(even) {
      background-color: #e1ebeb;
      /* Light teal for even rows */
    }

    .datatable-buttons tbody tr:nth-child(odd) {
      background-color: #ffffff;
      /* White for odd rows */
    }

    .datatable-buttons th {
      background-color: #056565;
      /* Teal header */
      color: white;
      font-weight: 500;
    }

    .datatable-buttons th,
    .datatable-buttons td {
      white-space: nowrap;
      /* Prevent text from wrapping */
      /* overflow: hidden; */
      text-overflow: ellipsis;
      /* Ellipsis for overflowed text */
    }

    .checkbox-wrapper {
      position: relative;
      display: inline-block;
      width: 18px;
      height: 18px;
    }

    .checkbox-wrapper svg {
      width: 100%;
      height: 100%;
    }

    .checkbox-wrapper .background {
      fill: #ccc;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper .stroke {
      fill: none;
      stroke: #fff;
      stroke-miterlimit: 10;
      stroke-width: 1.6px;
      stroke-dashoffset: 100;
      stroke-dasharray: 100;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper .check {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3px;
      stroke-dashoffset: 22;
      stroke-dasharray: 22;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper input[type=checkbox] {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      margin: 0;
      opacity: 0;
      appearance: none;
    }

    .checkbox-wrapper input[type=checkbox]:hover {
      cursor: pointer;
    }

    .checkbox-wrapper input[type=checkbox]:checked+svg .background {
      fill: #056565;
    }

    .checkbox-wrapper input[type=checkbox]:checked+svg .stroke,
    .checkbox-wrapper input[type=checkbox]:checked+svg .check {
      stroke-dashoffset: 0;
    }

    .vertical-middle-left {
      vertical-align: middle !important;
      text-align: left !important;
    }

    .status-badge {

    }

    .Unsold {

    }

  <!-- fetching data from backend and populate frontend table -->
  <script>
    let reportData, company;

    window.addEventListener("DOMContentLoaded", () => {
      fetch(`${api}/inventory/products/hold`, {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      })
        .then(res => res.json())
        .then(data => {
          reportData = data.quotations || []
          renderQuotationTable(data.quotations || []);
        })
        .catch(err => console.error('Error loading quotations:', err));

    })
    function renderQuotationTable(quotations) {
      const tbody = document.querySelector('#quotation-table tbody');
      tbody.innerHTML = ''; // clear previous rows

      quotations.forEach(quotation => {
        const { memo_no, status, associated_name, created_at, updated_at, details } = quotation;
        const rowspan = details.length;

        details.forEach((detail, index) => {
          const row = document.createElement('tr');

          // Only insert memo_no and associated_name on the first row with rowspan
          if (index === 0) {
            const memoCell = document.createElement('td');
            memoCell.setAttribute('rowspan', rowspan);
            memoCell.innerHTML = `<button class="btn btn-xs btn-primary" onclick="viewQuotationByMemo('${memo_no}', '${status}')">${memo_no}</button>`;
            row.appendChild(memoCell);


            const customerCell = document.createElement('td');
            customerCell.setAttribute('rowspan', rowspan);
            customerCell.textContent = associated_name;
            row.appendChild(customerCell);
          }

          // Product detail cells
          row.innerHTML += `
            <td class="text-primary">${detail.product_name}</td>
            <td>${detail.serial_number}</td>
            <td>${detail.product_warranty}</td>
            <td>${detail.quantity}</td>
            <td>${detail.rate}</td>
            <td>${detail.item_discount}</td>
            <td><span class="status-badge ${detail.status}">${detail.status}</span></td>
            <td>${moment(detail.created_at).format('DD-MMM-YYYY')}</td>
            <td>${moment(detail.updated_at).format('DD-MMM-YYYY')}</td>
          `;

          tbody.appendChild(row);
        });
      });
    }

    function viewQuotationByMemo(memoNo, status) {
      const quotation = reportData.find(q => q.memo_no === memoNo);

      if (!quotation) {
        Swal.fire("Not Found", "Quotation not found in loaded data.", "error");
        return;
      }

      if (!quotation.details || quotation.details.length === 0) {
        Swal.fire("Empty", "This quotation has no product items.", "info");
        return;
      }

      let html = `
        <div style="text-align: left;">
          <p><strong>Quotation No:</strong> ${quotation.memo_no}</p>
          <p><strong>Customer:</strong> ${quotation.associated_name}</p>
          <div style="max-height: 300px; overflow-y: auto;">
            <table class="table table-bordered table-sm" style="width:100%; font-size: 13px;">
              <thead class="thead-dark">
                <tr>
                  <th>Product Name</th>
                  <th>Quantity</th>
                  <th>Rate</th>
                  <th>Discount</th>
                </tr>
              </thead>
              <tbody>`;

      quotation.details.forEach(item => {
        html += `
          <tr>
            <td>${item.product_name}</td>
            <td>${item.quantity}</td>
            <td>${item.rate}</td>
            <td>${item.item_discount}</td>
          </tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      Swal.fire({
        title: 'Select Quotation Items',
        html: html,
        width: '700px',
        showCancelButton: true,
        showConfirmButton: status == 'Hold',
        confirmButtonText: 'Confirm',
        cancelButtonText: 'Cancel',
      }).then(result => {
        if (result.isConfirmed) {
          localStorage.setItem(quotation.memo_no,JSON.stringify(quotation));
          const data = { associated_id: quotation.associated_id, memo: quotation.memo_no };
          const queryString = new URLSearchParams(data).toString();
          window.location.href = "sale.html?" + queryString;
        }
      });
    }
  </script>
