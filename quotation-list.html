  <style>
    h2 {
      overflow: hidden;

    /* Force the table to fit within its container */
    .datatable-buttons {
      width: 100% !important;
      table-layout: auto;
      /* Fix column width to prevent overflow */
    }

    .datatable-buttons tbody tr:nth-child(even) {
      background-color: #e1ebeb;
      /* Light teal for even rows */
    }

    .datatable-buttons tbody tr:nth-child(odd) {
      background-color: #ffffff;
      /* White for odd rows */
    }

    .datatable-buttons th {
      background-color: #056565;
      /* Teal header */
      color: white;
      font-weight: 500;
    }

    .datatable-buttons th,
    .datatable-buttons td {
      white-space: nowrap;
      /* Prevent text from wrapping */
      /* overflow: hidden; */
      text-overflow: ellipsis;
      /* Ellipsis for overflowed text */
    }

    .checkbox-wrapper {
      position: relative;
      display: inline-block;
      width: 18px;
      height: 18px;
    }

    .checkbox-wrapper svg {
      width: 100%;
      height: 100%;
    }

    .checkbox-wrapper .background {
      fill: #ccc;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper .stroke {
      fill: none;
      stroke: #fff;
      stroke-miterlimit: 10;
      stroke-width: 1.6px;
      stroke-dashoffset: 100;
      stroke-dasharray: 100;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper .check {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3px;
      stroke-dashoffset: 22;
      stroke-dasharray: 22;
      transition: ease all 0.6s;
    }

    .checkbox-wrapper input[type=checkbox] {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      margin: 0;
      opacity: 0;
      appearance: none;
    }

    .checkbox-wrapper input[type=checkbox]:hover {
      cursor: pointer;
    }

    .checkbox-wrapper input[type=checkbox]:checked+svg .background {
      fill: #056565;
    }

    .checkbox-wrapper input[type=checkbox]:checked+svg .stroke,
    .checkbox-wrapper input[type=checkbox]:checked+svg .check {
      stroke-dashoffset: 0;
    }

    .vertical-middle-left {
      vertical-align: middle !important;
      text-align: left !important;
    }

    .status-badge {

  <!-- fetching data from backend and populate frontend table -->
  <script>
    let reportData, company;

    window.addEventListener("DOMContentLoaded", () => {
      fetch(`${api}/inventory/products/quotation`, {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      })
        .then(res => res.json())
        .then(data => {
          reportData = data.quotations || []
          renderQuotationTable(data.quotations || []);
        })
        .catch(err => console.error('Error loading quotations:', err));

    })
    function renderQuotationTable(quotations) {
      const tbody = document.querySelector('#quotation-table tbody');
      tbody.innerHTML = ''; // clear previous rows

      quotations.forEach(quotation => {
        const { memo_no, associated_name, created_at, updated_at, details } = quotation;
        const rowspan = details.length;

        details.forEach((detail, index) => {
          const row = document.createElement('tr');

          // Only insert memo_no and associated_name on the first row with rowspan
          if (index === 0) {
            const memoCell = document.createElement('td');
            memoCell.setAttribute('rowspan', rowspan);
            memoCell.innerHTML = `<button class="btn btn-xs btn-primary" onclick="viewQuotationByMemo('${memo_no}')">${memo_no}</button>`;
            row.appendChild(memoCell);


            const customerCell = document.createElement('td');
            customerCell.setAttribute('rowspan', rowspan);
            customerCell.textContent = associated_name;
            row.appendChild(customerCell);
          }

          // Product detail cells
          row.innerHTML += `
            <td class="text-primary">${detail.product_name}</td>
            <td>${detail.product_warranty}</td>
            <td>${detail.quantity}</td>
            <td>${detail.rate}</td>
            <td>${detail.item_discount}</td>
            <td><span class="status-badge ${detail.status}">${detail.status}</span></td>
            <td>${moment(detail.created_at).format('DD-MMM-YYYY')}</td>
            <td>${moment(detail.updated_at).format('DD-MMM-YYYY')}</td>
          `;

          tbody.appendChild(row);
        });
      });
    }

    function viewQuotationByMemo(memoNo) {
      const quotation = reportData.find(q => q.memo_no === memoNo);

      if (!quotation) {
        Swal.fire("Not Found", "Quotation not found in loaded data.", "error");
        return;
      }

      if (!quotation.details || quotation.details.length === 0) {
        Swal.fire("Empty", "This quotation has no product items.", "info");
        return;
      }

      let html = `
        <div style="text-align: left;">
          <p><strong>Quotation No:</strong> ${quotation.memo_no}</p>
          <p><strong>Customer:</strong> ${quotation.associated_name}</p>
          <div style="max-height: 300px; overflow-y: auto;">
            <table class="table table-bordered table-sm" style="width:100%; font-size: 13px;">
              <thead class="thead-dark">
                <tr>
                  <th>Product Name</th>
                  <th>Quantity</th>
                  <th>Rate</th>
                  <th>Discount</th>
                </tr>
              </thead>
              <tbody>`;

      quotation.details.forEach(item => {
        html += `
          <tr>
            <td>${item.product_name}</td>
            <td>${item.quantity}</td>
            <td>${item.rate}</td>
            <td>${item.item_discount}</td>
          </tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      Swal.fire({
        title: 'Select Quotation Items',
        html: html,
        width: '700px',
        showCancelButton: true,
        confirmButtonText: 'Confirm',
        cancelButtonText: 'Cancel',
      }).then(result => {
        if (result.isConfirmed) {
          localStorage.setItem(quotation.memo_no,JSON.stringify(quotation));
          const data = { associated_id: quotation.associated_id, memo: quotation.memo_no };
          const queryString = new URLSearchParams(data).toString();
          window.location.href = "sale.html?" + queryString;
        }
      });
    }

    function customPrintFunction() {
      let n = reportData.length;
      let tBody = '';

      if (n > 0) {
        for (let i = 0; i < n; i++) {
          const c = reportData[i];
          tBody += `
            <tr>
              <td>${c.account_code}</td>
              <td>${c.account_name}</td>
              <td>${c.account_status}</td>
              <td>${c.mobile}</td>
              <td>${c.due_amount || "0"}</td>
              <td>${moment(c.joining_date).format("DD-MMM-YYYY")}</td>
            </tr>`;
        }
      } else {
        tBody = `
          <tr><td colspan=6 style="text-align:center;">No data available</td></tr>`;
      }

      const content = `
        <!DOCTYPE html>
        <html lang="en">

        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>PSInventory</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              margin: 0 5mm;
              padding: 0;
              background-color: white;
            }

            .separator {
              width: 100%;
              border-bottom: 2px solid #265166;
              margin: 5px 0;
            }

            .header {
              justify-self: center;
              display: flex;
              align-items: center;
              color: white;
            }

            .header img {
              width: 120px;
              height: 120px;
              padding-right: 10px;
            }

            .header .name {
              font-size: 28px;
              font-weight: bold;
            }

            /* Info Section Styling for Print */
          .info {
            text-align: center;
            margin-bottom: 10px;
            padding-left:10px;
            border-radius: 8px;
            font-size: 16px;
            color: #061f1f;
          }

          .info h1 {
            font-size: 26px;
            color: #265166;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
          }

          .info h2 {
            font-size: 14px;
            color: #008080;
            font-style: italic;
            margin-bottom: 15px;
          }

          .info p {
            margin: 8px 0;
            font-size: 14px;
            color: #333;
          }

          .info p:first-child {
            margin-top: 0;
          }

          /* Print Specific Adjustments */
          @media print {
            body {
              margin: 0;
              padding: 0;
            }

            .info {
              font-size: 14px;
            }

            .info h1 {
              font-size: 24px;
              margin-bottom: 10px;
            }

            .info h2 {
              font-size: 12px;
              margin-bottom: 10px;
            }

            .info p {
              font-size: 12px;
              margin: 5px 0;
            }

            .info .contact-info p {
              font-size: 12px;
              margin-bottom: 8px;
            }
            th {
              background-color: #fff;
              color: #000000;
            }
          }

            /* table caption and printing date section */
            .caption-section {
              display: flex;
              justify-content: space-between;
              align-items: center;
              color: #1d1c1c;
            }

            .caption-section .caption {
              font-size: 18px;
              font-weight: bold;
              color: #265166;
            }
            .caption-section .print-date {
              font-size: 12px;
              font-weight: bold;
              font-style:italic;
            }

            /* Table styling */
            table {
              width: 100%;
              border-collapse: collapse;
              font-family: Arial, sans-serif;
            }

            th,
            td {
              padding: 5px;
              font-size: 12px;
              text-align: left;
              border: 0.1em solid rgba(0, 0, 0, 0.25);
            }

            th {
              background-color: #008080;
              color: white;
              text-align: center;
            }

            tr:nth-child(even) {
              background-color: rgba(0, 128, 128, 0.1);
            }

            tr:nth-child(odd) {
              background-color: #ffffff;
            }

            /* Footer styling */
            .footer {
              position: fixed;
              bottom: 0;
              width: 100%;
              text-align: center;
              font-size: 12px;
              color: #666;
              padding: 10px 0;
            }

            .footer .page-number:after {
              content: counter(page);
            }
          </style>
        </head>

        <body>
          <div class="header">
            <img src="src\assets\images\logo.png" alt="logo">
            <div class="info">
              <h1>${company.name}</h1>
              ${company.slogan == "" ? '' : `<h2>${company.slogan}</h2>`}
              ${company.area == "" ? '' : `<p>${company.area}</p>`}
              <p>Mobile: ${company.mobile}</p>
              <p>${company.email == '' ? '' : `Email: ${company.email}`}${company.website == '' ? '' : ` || Website: ${company.website}`}</p>
            </div>

          </div>
          <!-- Line with Caption and Print Date -->
          <div class="caption-section">
            <div class="caption">List of Quotations</div>
            <div class="print-date">Printed on: ${moment().format("DD-MMM-YYYY")}</div>
          </div>
          <div class="separator"></div>
          <!-- Table Section -->
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Status</th>
                <th>Mobile</th>
                <th>Due Amount</th>
                <th>Joining Date</th>
              </tr>
            </thead>
            <tbody>
              ${tBody}
            </tbody>
          </table>
        </body>
        </html>
      `
      // Create an iframe to load the content
      const iframe = document.createElement('iframe');
      document.body.appendChild(iframe);
      iframe.style.display = 'none';
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(content);
      doc.close();

      // Wait for content to load and then print
      iframe.onload = () => {
        document.title = 'quotation_list_' + moment().format('D_MMM_YYYY_hh_mm_ss')
        iframe.contentWindow.print();
        document.body.removeChild(iframe);
      };
    }

  </script>
