  <script>
    let memos, InvoiceData = null, company
    document.addEventListener('DOMContentLoaded', function () {

      const params = new URLSearchParams(window.location.search);
      const memo = params.get("print");
      if (memo?.trim() != "") {
        memoType = ""
        if (memo?.startsWith("SL", 0)) {
          printInvoice("sale", memo, null)
        }

      }
      updateTable("sale")
      // Tab switching
      const tabButtons = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Remove active class from all buttons and contents
          tabButtons.forEach(btn => btn.classList.remove('active'));
          tabContents.forEach(content => content.classList.remove('active'));

          // Add active class to clicked button and corresponding content
          button.classList.add('active');
          const tabId = button.getAttribute('data-tab');
          document.getElementById(`${tabId}-tab`).classList.add('active');

          //update table
          updateTable(tabId)
        });
      });
    });

    function updateTable(tabId) {
      // Fetch all data once and let DataTables handle searching/pagination on client side
      const requestOptions = {
        method: 'post',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token'),
        },
      }
      fetch(api + '/inventory/memos/list?type=' + tabId, requestOptions)
        .then(response => response.json())
        .then(function (responseData) {
          memos = responseData.memos || [];
          company = responseData.company;
          console.log("History: ", responseData)
          const tbody = document.getElementById(tabId + "-tbody")
          tbody.innerHTML = ""
          if (responseData.error === false) {
            if (memos.length === 0) {
              document.getElementById(tabId + "-tbody").innerHTML =
                `<td colspan="7" class="text-primary text-center">
                    No data available
                  </td>`
            } else {
              memos.forEach((v, i) => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                  <td>${i + 1}</td>
                  <td data-user="${v.user_id}">${v.user_name}</td>
                  <td>${v.memo_no}</td>
                  <td>${v.date}</td>
                  <td>${moment(v.created_at).format("DD-MMM-YYYY")}</td>
                  <td>${moment(v.updated_at).format("DD-MMM-YYYY")}</td>
                `;

                // Create the Print button
                const td = document.createElement('td');
                // create button
                const btn = document.createElement('button');
                btn.className = "btn btn-primary btn-xs";
                btn.textContent = "Print";
                btn.dataset.memo = v.memo_no; // attach memo to dataset

                btn.addEventListener("click", function (event) {
                  printInvoice(tabId, v.memo_no, event);  // only pass tabId + event
                });


                td.appendChild(btn);
                tr.appendChild(td);
                tbody.appendChild(tr);
              })
            }
          }
        })
        .catch(function (error) {
          console.error('Error fetching data:', error);
        })
        .finally(() => {
          hidePreloader()
        });
    }

    function printInvoice(tabId, memo_no, event = null) {
      showPreloader()
      const btn = event?.target;
      if (btn) {
        btn.disabled = true;
      }


      fetch(api + `/inventory/memo/details?type=${tabId}&memo_no=${memo_no}`, {
        method: 'post',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token'),
        },
      })
        .then(r => r.json())
        .then(responseData => {
          InvoiceData = responseData.invoice_data || null;
          company = JSON.parse(localStorage.getItem("company"));
          console.log("invoice_data: ", responseData)
          if (tabId === "purchase")printPurchaseInvoice();
          else if (tabId === "purchase-return") printPurchaseReturnInvoice();
          else if (tabId === "sale") printSaleInvoice();
          else if (tabId === "sale-return") printSaleReturnInvoice();
        })
        .catch(err => console.error('Error fetching data:', err))
        .finally(() => {
          if (btn) {
            btn.disabled = false;
          }

          hidePreloader()
        });
    }

  </script>
