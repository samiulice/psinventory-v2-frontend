  <script>
    let products = [], containers = [], src_container = null, dest_container = null;


    // Function to format numbers with commas
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    // Function to render product tables
    function renderProductTables() {
      const container = document.getElementById('tables-container');
      container.innerHTML = '';

      // Group products by name
      const productsMap = new Map();
      console.log(products)
      // Safely iterate over the products array.
      products?.forEach((product, index) => { // Added '?'
        // Ensure product is not null and has a name before proceeding.
        if (product && product.product_name) {
          if (!productsMap.has(product.product_name)) {
            productsMap.set(product.product_name, []);
          }

          // Safely iterate over product_metadata.
          product.product_metadata?.forEach(meta => { // Added '?'
            productsMap.get(product.product_name).push(meta);
          });
        }
      });

      // Create tables for each product group
      productsMap.forEach((metadatas, productName) => {
        const table = document.createElement('table');

        // Create group header
        const groupHeader = document.createElement('tr');
        groupHeader.className = 'group-header';
        groupHeader.innerHTML = `
          <td colspan="9">${productName}</td>
        `;

        // Create column headers
        const headerRow = document.createElement('tr');
        headerRow.innerHTML = `         
          <th>Serial Number</th>
          <th>Purchase Date</th>
          <th>Status</th>
          <th>Warranty Status</th>
          <th>Max Retail Price</th>
          <th>Purchase Rate</th>
          <th>Purchase Discount</th>
          <th>Shipment Cost</th>
          <th>Total Cost</th>
        `;

        const thead = document.createElement('thead');
        thead.appendChild(groupHeader);
        thead.appendChild(headerRow);

        const tbody = document.createElement('tbody');
        let totalCost = 0;
        let totalShipmentCost = 0;
        let totalPurchaseDiscount = 0;
        let itemCount = 0;
        let stockCount = 0;

        // Create rows for each product metadata
        metadatas.forEach(meta => {
          const netCost = meta.purchase_rate - meta.purchase_discount + meta.shipment_cost_per_unit;
          totalCost += netCost;
          totalShipmentCost += meta.shipment_cost_per_unit;
          totalPurchaseDiscount += meta.purchase_discount;
          itemCount++;

          let productStatus = `<td class="status-out-of-stock">${meta.status}</td>`;
          if (meta.status == 'in stock') {
            stockCount++;
            productStatus = `<td class="status-in-stock">In Stock</td>`;
          }

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${meta.serial_number}</td>
            <td>${moment(meta.created_at).format('DD-MMM-YYYY')}</td>
            ${productStatus}
            <td>${meta.warranty_status}</td>
            <td>${formatNumber(meta.max_retail_price)}</td>
            <td>${formatNumber(meta.purchase_rate)}</td>
            <td>${formatNumber(meta.purchase_discount)}</td>
            <td>${formatNumber(meta.shipment_cost_per_unit)}</td>
            <td>${formatNumber(netCost)}</td>
          `;
          tbody.appendChild(row);
        });

        // Create total row
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
          <td>Total Items: ${itemCount} items</td>
          <td></td>
          <td>In-Stock: ${stockCount}</td>
          <td></td>
          <td></td>
          <td>${formatNumber(totalCost + totalPurchaseDiscount - totalShipmentCost)}</td>
          <td>${formatNumber(totalPurchaseDiscount)}</td>
          <td>${formatNumber(totalShipmentCost)}</td>
          <td>${formatNumber(totalCost)}</td>
        `;
        tbody.appendChild(totalRow);

        table.appendChild(thead);
        table.appendChild(tbody);
        container.appendChild(table);
      });
    }

    // Initialize the page
    window.addEventListener('DOMContentLoaded', function () {
      // Initialize table
      const requestOptions = {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      };
      fetch(api + '/inventory/products/items', requestOptions)
        .then(response => response.json())
        .then(resp => {
          console.log(resp);
          if (resp.error) {
            alertQuestion(resp.message);
          } else {
            products = resp.products || [];

            renderProductTables();
            return;
          }
        });
    });

    function customPrintFunction() {
      let [companyFName, companyLName = ""] = company.name.split(":::").filter(p => p.trim());

      // Build table body for products
      let tablesHtml = '';
      const productsMap = new Map();

      // Safely iterate over the products array.
      products?.forEach((product, index) => { // Added '?'
        // Ensure product is not null and has a name before proceeding.
        if (product && product.product_name) {
          if (!productsMap.has(product.product_name)) {
            productsMap.set(product.product_name, []);
          }

          // Safely iterate over product_metadata.
          product.product_metadata?.forEach(meta => { // Added '?'
            productsMap.get(product.product_name).push(meta);
          });
        }
      });

      productsMap.forEach((metadatas, productName) => {
        let totalCost = 0;
        let totalShipmentCost = 0;
        let totalPurchaseDiscount = 0;
        let itemCount = 0;
        let stockCount = 0;
        let rows = '';

        metadatas.forEach(meta => {
          const netCost = meta.purchase_rate - meta.purchase_discount + meta.shipment_cost_per_unit;
          totalCost += netCost;
          totalShipmentCost += meta.shipment_cost_per_unit;
          totalPurchaseDiscount += meta.purchase_discount;
          itemCount++;

          let productStatus = `<td class="status-out-of-stock">${meta.status}</td>`;
          if (meta.status === 'in stock') {
            stockCount++;
            productStatus = `<td class="status-in-stock">In Stock</td>`;
          }

          rows += `
            <tr>
              <td>${meta.serial_number}</td>
              <td>${moment(meta.created_at).format('DD-MMM-YYYY')}</td>
              ${productStatus}
              <td>${meta.warranty_status}</td>
              <td>${formatNumber(meta.max_retail_price)}</td>
              <td>${formatNumber(meta.purchase_rate)}</td>
              <td>${formatNumber(meta.purchase_discount)}</td>
              <td>${formatNumber(meta.shipment_cost_per_unit)}</td>
              <td>${formatNumber(netCost)}</td>
            </tr>`;
        });

        const totalRow = `
          <tr class="total-row">
            <td>Total Items: ${itemCount} items</td>
            <td></td>
            <td>In-Stock: ${stockCount}</td>
            <td></td>
            <td></td>
            <td>${formatNumber(totalCost + totalPurchaseDiscount - totalShipmentCost)}</td>
            <td>${formatNumber(totalPurchaseDiscount)}</td>
            <td>${formatNumber(totalShipmentCost)}</td>
            <td>${formatNumber(totalCost)}</td>
          </tr>`;

        tablesHtml += `
          <table>
            <thead>
              <tr class="group-header">
                <td colspan="9">${productName}</td>
              </tr>
              <tr>
                <th>Serial Number</th>
                <th>Purchase Date</th>
                <th>Status</th>
                <th>Warranty Status</th>
                <th>Max Retail Price</th>
                <th>Purchase Rate</th>
                <th>Purchase Discount</th>
                <th>Shipment Cost</th>
                <th>Total Cost</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
              ${totalRow}
            </tbody>
          </table><br/>`;
      });

      // Final print content
      const content = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>Product Report</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 10mm; }
            .header {
              justify-self: center;
              display: flex;
              align-items: center;
              color: white;
            }

            .header img {
              width: 120px;
              height: 120px;
              padding-right: 10px;
            }

            .header .name {
              font-size: 28px;
              font-weight: bold;
            }

            /* Info Section Styling for Print */
            .info {
              text-align: center;
              margin-bottom: 10px;
              padding-left:10px;
              border-radius: 8px;
              font-size: 16px;
              color: #061f1f;
            }

            .info h1 {
              font-size: 26px;
              color: #265166;
              font-weight: bold;
              margin-bottom: 12px;
              text-transform: uppercase;
              letter-spacing: 1px;
            }

            .info h2 {
              font-size: 14px;
              color: #008080;
              font-style: italic;
              margin-bottom: 15px;
            }

            .info p {
              margin: 8px 0;
              font-size: 14px;
              color: #333;
            }

            .info p:first-child {
              margin-top: 0;
            }
            
            .caption-section {
              display: flex;
              justify-content: space-between;
              align-items: center;
              color: #1d1c1c;
            }

            .caption-section .caption {
              font-size: 18px;
              font-weight: bold;
              color: #265166;
            }
            .caption-section .print-date {
              font-size: 12px;
              font-weight: bold;
              font-style:italic;
            }

            /* Print Specific Adjustments */
            @media print {
              body {
                margin: 10px;
                padding: 0;
              }

              .info {
                font-size: 14px;
              }

              .info h1 {
                font-size: 24px;
                margin-bottom: 10px;
              }

              .info h2 {
                font-size: 12px;
                margin-bottom: 10px;
              }

              .info p {
                font-size: 12px;
                margin: 5px 0;
              }

              .info .contact-info p {
                font-size: 12px;
                margin-bottom: 8px;
              }
              th {
                background-color: #fff;
                color: #000000;
              }
            }
            table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
            th, td { border: 1px solid #ccc; padding: 6px; font-size: 12px; }
            th { background: #008080; color: white; text-align: center; }
            tr:nth-child(even) { background: rgba(0,128,128,0.05); }
            .group-header td { background: #265166; color: white; font-weight: bold; text-align: center; }
            .total-row { font-weight: bold; background: #f1f1f1; }
            .status-in-stock { color: green; font-weight: bold; }
            .status-out-of-stock { color: red; font-weight: bold; }
          </style>
        </head>
        <body>
          <div class="header">
            <img id="sidebar-logo" src="${api}/images/logo/logo.png" alt="logo">
            <div class="info">
              <h1>${companyFName} ${companyLName}</h1>
              ${company.slogan == "" ? '' : `<h2>${company.slogan}</h2>`}
              ${company.area == "" ? '' : `<p>${company.area}</p>`}
              <p>Mobile: ${company.mobile}</p>
              <p>${company.email == '' ? '' : `Email: ${company.email}`}${company.website == '' ? '' : ` || Website: ${company.website}`}</p>
            </div>
          </div>

          <div class="caption-section">
            <div class="caption">Product Stock Report</div>
            <div class="print-date">Printed on: ${moment().format("DD-MMM-YYYY")}</div>
          </div>

          ${tablesHtml}
        </body>
        </html>
      `;

      const title = 'product_report_' + moment().format('D_MMM_YYYY_hh_mm_ss');
      printWindow(content, title);
    }

  </script>
