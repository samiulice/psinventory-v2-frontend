  <script>
    let products = [], containers = [], src_container = null, dest_container = null;


    // Function to format numbers with commas
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    // Function to set up event listeners
    function setupEventListeners() {
      // Print button
      document.getElementById('print-btn').addEventListener('click', function () {
        window.print();
      });

      // // Export button
      // document.getElementById('export-btn').addEventListener('click', function () {
      //   alert('Export functionality would be implemented here. Selected items would be exported.');
      // });
    }
    // Function to render product tables
    function renderProductTables() {
      const container = document.getElementById('tables-container');
      container.innerHTML = '';

      // Group products by name
      const productsMap = new Map();

      products.forEach(product => {
        if (!productsMap.has(product.product_name)) {
          productsMap.set(product.product_name, []);
        }
        product.product_metadata.forEach(meta => {
          productsMap.get(product.product_name).push(meta);
        });
      });

      // Create tables for each product group
      productsMap.forEach((metadatas, productName) => {
        const table = document.createElement('table');

        // Create group header
        const groupHeader = document.createElement('tr');
        groupHeader.className = 'group-header';
        groupHeader.innerHTML = `
          <td colspan="9">${productName}</td>
        `;

        // Create column headers
        const headerRow = document.createElement('tr');
        headerRow.innerHTML = `         
          <th>Serial Number</th>
          <th>Purchase Date</th>
          <th>Status</th>
          <th>Warranty Status</th>
          <th>Max Retail Price</th>
          <th>Purchase Rate</th>
          <th>Purchase Discount</th>
          <th>Shipment Cost</th>
          <th>Total Cost</th>
        `;

        const thead = document.createElement('thead');
        thead.appendChild(groupHeader);
        thead.appendChild(headerRow);

        const tbody = document.createElement('tbody');
        let totalCost = 0;
        let totalShipmentCost = 0;
        let totalPurchaseDiscount = 0;
        let itemCount = 0;
        let stockCount = 0;

        // Create rows for each product metadata
        metadatas.forEach(meta => {
          const netCost = meta.purchase_rate - meta.purchase_discount + meta.shipment_cost_per_unit;
          totalCost += netCost;
          totalShipmentCost += meta.shipment_cost_per_unit;
          totalPurchaseDiscount += meta.purchase_discount;
          itemCount++;

          let productStatus = `<td class="status-out-of-stock">${meta.status}</td>`;
          if (meta.status == 'in stock') {
            stockCount++;
            productStatus = `<td class="status-in-stock">In Stock</td>`;
          }

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${meta.serial_number}</td>
            <td>${moment(meta.created_at).format('DD-MMM-YYYY')}</td>
            ${productStatus}
            <td>${meta.warranty_status}</td>
            <td>${formatNumber(meta.max_retail_price)}</td>
            <td>${formatNumber(meta.purchase_rate)}</td>
            <td>${formatNumber(meta.purchase_discount)}</td>
            <td>${formatNumber(meta.shipment_cost_per_unit)}</td>
            <td>${formatNumber(netCost)}</td>
          `;
          tbody.appendChild(row);
        });

        // Create total row
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
          <td>Total Items: ${itemCount} items</td>
          <td></td>
          <td>In-Stock: ${stockCount}</td>
          <td></td>
          <td></td>
          <td>${formatNumber(totalCost + totalPurchaseDiscount - totalShipmentCost)}</td>
          <td>${formatNumber(totalPurchaseDiscount)}</td>
          <td>${formatNumber(totalShipmentCost)}</td>
          <td>${formatNumber(totalCost)}</td>
        `;
        tbody.appendChild(totalRow);

        table.appendChild(thead);
        table.appendChild(tbody);
        container.appendChild(table);
      });

      // Add event listeners after tables are rendered
      setupEventListeners();
    }

    // Initialize the page
    window.addEventListener('DOMContentLoaded', function () {
      // Initialize table
      const requestOptions = {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      };
      fetch(api + '/inventory/products/items', requestOptions)
        .then(response => response.json())
        .then(resp => {
          console.log(resp);
          if (resp.error) {
            alertQuestion(resp.message);
          } else {
            products = resp.products || [];

            renderProductTables();
            return;
          }
        });
    });
