  <script>
    let warehouses, selectedWarehouse;
    const requestOptions = {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      }
    };
    fetch(api + '/warehouses', requestOptions)
      .then(response => response.json())
      .then(function (data) {
        warehouses = data.warehouses || [];
        updateWarehouseDiv(warehouses);
      })
      .catch(function (error) {
        console.error('Error fetching data:', error);
      });
    //updateWarehouseDiv updates warehouse selection options with the fetched data
    function updateWarehouseDiv() {
      const container = document.getElementById('warehouse_name-autocomplete-container');
      const input = document.getElementById("warehouse_name");
      const suggestions = document.getElementById("warehouse_name-suggestions");

      // Function to populate suggestions
      function populateSuggestions(filteredWarehouses) {
        suggestions.innerHTML = '';
        if (filteredWarehouses.length === 0) {
          suggestions.innerHTML = `<div class="autocomplete-item">No results found</div>`;
          return;
        }
        filteredWarehouses.forEach(warehouse => {
          const div = document.createElement("div");
          div.className = "autocomplete-item";
          div.innerHTML = `
                <div class="d-flex justify-content-between">
                  <span>${warehouse.name}</span>
                  <small class="text-muted">${warehouse.address}</small>
                </div>
              `;
          div.onclick = () => {
            input.value = warehouse.name;
            suggestions.style.display = 'none';
            selectedWarehouse = warehouse;
          };
          suggestions.appendChild(div);
        });

      }

      input.addEventListener("input", function (e) {
        const searchTerm = e.target.value.toLowerCase();
        suggestions.style.display = 'block';

        if (!searchTerm) {
          suggestions.style.display = 'none';
          return;
        }

        const filtered = warehouses
          .filter(s =>
            s.account_name.toLowerCase().includes(searchTerm) ||
            s.mobile.includes(searchTerm)
          )
          .slice(0, 15);
        populateSuggestions(filtered);
      });

      // Show all suggestions on first click
      input.addEventListener("focus", function () {
        const filtered = warehouses.slice(0, 15);
        suggestions.style.display = 'block';
        populateSuggestions(filtered);
      });

      // Hide suggestions when clicking outside
      document.addEventListener("click", (e) => {
        if (!container.contains(e.target)) {
          suggestions.style.display = 'none';
        }
      });
    }


    document.getElementById("submitBtn").addEventListener("click", function () {
      const form = document.getElementById('container-form');

      if (!form.checkValidity()) {
        form.reportValidity(); // Show default browser validation messages
        return;
      }


      // Extract values from form
      const name = document.getElementById("name").value.trim();
      const dimension = document.getElementById("dimension").value.trim();
      const description = document.getElementById("description").value.trim();
      const status = document.getElementById("status_active").checked;
      const warehouseId = selectedWarehouse?.id || 0;
      const warehouseName = selectedWarehouse?.name || '-';

      // Show confirmation modal
      Swal.fire({
        title: 'Add New Container',
        width: 450,
        html: `
          <table style="width:100%; font-size:15px; text-align:left;">
              <tr>
                <td style="padding: 6px 0;"><strong>Name:</strong></td>
                <td style="padding: 6px 0;">${name}</td>
              </tr>
              <tr>
                <td style="padding: 6px 0;"><strong>Dimension:</strong></td>
                <td style="padding: 6px 0;">${dimension || '-'}</td>
              </tr>
              <tr>
                <td style="padding: 6px 0;"><strong>Status:</strong></td>
                <td style="padding: 6px 0;">${status ? 'Active' : 'Inactive'}</td>
              </tr>
              <tr>
                <td style="padding: 6px 0;"><strong>Description:</strong></td>
                <td style="padding: 6px 0;">${description || '-'}</td>
              </tr>
              <tr>
                <td style="padding: 6px 0;"><strong>Warehouse:</strong></td>
                <td style="padding: 6px 0;">${warehouseName}</td>
              </tr>
            </table>
        `,
        showCancelButton: true,
        confirmButtonText: 'Confirm',
        cancelButtonText: 'Cancel',
        showCloseButton: true,
        allowOutsideClick: false
      }).then((result) => {
        if (result.isConfirmed) {
          submitForm(name, description, status, warehouseId, warehouseName)
        }
      });
    });

    async function submitForm(name, description, status, warehouseId, warehouseName) {
      const form = document.getElementById("container-form");

      try {
        const response = await fetch(api + '/warehouse/container', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify({
            name, description, status, warehouse_id: warehouseId, warehouse_name: warehouseName
          })
        });

        console.log(name, description, status, warehouseId, warehouseName)
        const data = await response.json();
        console.log(data)
        if (data.error == true) throw new Error(data.message);

        // Optionally reset form or do other UI updates here
        form.reset();
        showSuccessMessage(data.message)

      } catch (err) {
        console.error(err);
        alertQuestion(err);
      }
    };

  </script>
